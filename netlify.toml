# The site is plain HTML, CSS and JavaScript, so there's nothing to compile.
# Netlify's settings for this site still expect a "dist" folder (from the
# old React version), so the build just copies the site files into dist/.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html favicon.png logo-dark.png logo-light.png me.jpeg cv.pdf css js fonts data admin dist/"
